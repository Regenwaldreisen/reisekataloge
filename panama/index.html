
<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panama – Reisekatalog 01/2027 | Regenwaldreisen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf0;font-family:Arial,sans-serif;color:#203b34}
header{background:#fff;text-align:center;padding:12px 10px}
header strong{font-size:19px}
header small{display:block;margin-top:4px;color:#60736c}
.viewer{display:flex;justify-content:center;align-items:center;min-height:calc(100dvh - 145px);padding:12px}
#book{margin:auto}
.page{background:white}
.page img{display:block;width:100%;height:100%;object-fit:fill}
.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#fff;padding:12px;position:sticky;bottom:0}
button{border:0;background:#176a51;color:white;border-radius:6px;padding:11px 20px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
#count{min-width:110px;text-align:center;font-size:14px}
</style>
</head>
<body>
<header>
<strong>Panama · Reisekatalog 01/2027</strong>
<small>Regenwaldreisen – Reisen. Erleben. Entdecken.</small>
</header>

<main class="viewer">
<div id="book"></div>
</main>

<nav class="controls">
<button id="prev">← Zurück</button>
<span id="count">Seite 1 / 52</span>
<button id="next">Weiter →</button>
</nav>

<script src="page-flip.browser.js"></script>
<script>
'use strict';

const total = 52;
const book = document.getElementById('book');
const counter = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');

for(let i=1;i<=total;i++){
  const page=document.createElement('div');
  page.className='page';

  const img=document.createElement('img');
  img.src='pages/seite-'+String(i).padStart(2,'0')+'.jpg';
  img.alt='Panama – Seite '+i;
  img.draggable=false;

  page.appendChild(img);
  book.appendChild(page);
}

const flip=new St.PageFlip(book,{
  width:480,
  height:679,
  size:'stretch',
  minWidth:180,
  maxWidth:480,
  minHeight:255,
  maxHeight:679,
  showCover:true,
  usePortrait:true,
  mobileScrollSupport:false,
  drawShadow:true,
  maxShadowOpacity:0.45,
  flippingTime:850,
  autoSize:true,
  clickEventForward:true,
  swipeDistance:25
});

flip.loadFromHTML(document.querySelectorAll('.page'));

function update(){
  const current=flip.getCurrentPageIndex();
  counter.textContent='Seite '+(current+1)+' / '+total;
  prev.disabled=current===0;
  next.disabled=current>=total-1;
}

prev.addEventListener('click',()=>flip.flipPrev());
next.addEventListener('click',()=>flip.flipNext());

flip.on('flip',update);
flip.on('init',update);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')flip.flipNext();
  if(e.key==='ArrowLeft')flip.flipPrev();
});

update();
</script>
</body>
</html>
