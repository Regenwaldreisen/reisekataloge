<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenia – Reisekatalog 01/2027 | Regenwaldreisen</title><meta name="description" content="Kenia entdecken: der interaktive Reisekatalog 01/2027 von Regenwaldreisen.">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#15232b;color:#fff;font:16px Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#102029;padding:14px 20px}header strong{font-size:clamp(16px,2vw,22px)}header a{color:#d2e9e1;text-decoration:none;font-size:14px}main{min-height:calc(100dvh - 122px);display:flex;align-items:center;justify-content:center;padding:16px 12px}#stage{position:relative;width:min(100%,960px);height:min(75dvh,680px);min-height:320px;display:flex;align-items:center;justify-content:center}#book{margin:auto;filter:drop-shadow(0 10px 18px #0008)}#book .page{background:#fff;overflow:hidden}#book .page img{display:block;width:100%;height:100%;object-fit:fill}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;background:#15232b}#cover img{display:block;max-height:100%;max-width:100%;width:auto;height:auto;aspect-ratio:1/1.414;object-fit:contain;box-shadow:0 8px 25px #0008}#stage.cover-mode #book{visibility:hidden}#stage:not(.cover-mode) #cover{display:none}.controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:14px 12px 22px;flex-wrap:wrap}button{border:0;border-radius:6px;background:#e7eee9;color:#15232b;padding:11px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.38;cursor:default}#counter{min-width:135px;text-align:center;font-size:14px}#error{color:#f3d0c5;text-align:center;padding:0 12px 12px}@media(max-width:640px){header{padding:12px}header a{font-size:12px}main{min-height:calc(100dvh - 125px);padding:8px}#stage{height:min(72dvh,650px);min-height:280px}.controls{gap:10px}button{padding:10px 12px}#counter{min-width:105px}}
</style></head><body>
<header><strong>Kenia · Reisekatalog 01/2027</strong><a href="https://www.regenwaldreisen.ch/" target="_blank" rel="noopener">Regenwaldreisen.ch</a></header>
<main><div id="stage" class="cover-mode"><div id="book"></div><div id="cover"><img src="pages/seite-001.jpg" alt="Titelseite Kenia 01/2027"></div></div></main>
<nav class="controls" aria-label="Katalognavigation"><button id="prev" disabled>← Zurück</button><span id="counter">Seite 1 von 26</span><button id="next">Weiter →</button></nav><div id="error" role="alert"></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(()=>{'use strict';const total=26,stage=document.getElementById('stage'),book=document.getElementById('book'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),error=document.getElementById('error');let flip=null,coverMode=true;
function update(index){if(index===0){coverMode=true;stage.classList.add('cover-mode')}else{coverMode=false;stage.classList.remove('cover-mode')}counter.textContent=`Seite ${index+1} von ${total}`;prev.disabled=index===0;next.disabled=index>=total-1}
if(!window.St||!St.PageFlip){error.textContent='Die Blätterfunktion konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.';next.disabled=true;return}
try{for(let i=1;i<=total;i++){const p=document.createElement('div');p.className='page';if(i===1||i===total)p.dataset.density='hard';const img=document.createElement('img');img.src=`pages/seite-${String(i).padStart(3,'0')}.jpg`;img.alt=`Katalogseite ${i}`;img.loading='eager';;p.appendChild(img);book.appendChild(p)}
flip=new St.PageFlip(book,{width:480,height:679,size:'stretch',minWidth:230,maxWidth:480,minHeight:325,maxHeight:679,showCover:true,usePortrait:true,mobileScrollSupport:false,drawShadow:true,maxShadowOpacity:.45,flippingTime:850,autoSize:true,clickEventForward:true,swipeDistance:25});flip.loadFromHTML(book.querySelectorAll('.page'));
flip.on('flip',e=>update(e.data));flip.on('init',()=>update(0));flip.on('changeOrientation',()=>{if(coverMode)stage.classList.add('cover-mode')});
next.addEventListener('click',()=>{if(coverMode){stage.classList.remove('cover-mode');coverMode=false;flip.flipNext()}else flip.flipNext()});prev.addEventListener('click',()=>flip.flipPrev());document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!next.disabled)next.click();if(e.key==='ArrowLeft'&&!prev.disabled)prev.click()});update(0)
}catch(e){error.textContent='Der Katalog konnte nicht gestartet werden: '+e.message;next.disabled=true}
})();
</script></body></html>
