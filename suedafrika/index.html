
<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Südafrika – Reisekatalog 01/2027 | Regenwaldreisen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf0;font-family:Arial,sans-serif;color:#203b34}
header{background:#fff;text-align:center;padding:12px 10px}
header strong{font-size:19px}
header small{display:block;margin-top:4px;color:#60736c}
.viewer{display:flex;justify-content:center;align-items:center;min-height:calc(100dvh - 145px);padding:12px}
#book{margin:auto}
.page{background:white}
.page img{display:block;width:100%;height:100%;object-fit:fill}
.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#fff;padding:12px;position:sticky;bottom:0}
button{border:0;background:#176a51;color:white;border-radius:6px;padding:11px 20px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
#count{min-width:110px;text-align:center;font-size:14px}

.controls{flex-wrap:wrap;gap:8px}
.controls button{padding:11px 14px}
#zoomDialog{border:0;padding:0;width:100vw;max-width:none;height:100dvh;max-height:none;background:#182420;color:#fff}
#zoomDialog::backdrop{background:#182420}
.zoom-tools{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
.zoom-tools button{padding:10px 14px}
#zoomLevel{min-width:48px;text-align:center}
#zoomViewport{position:relative;height:calc(100dvh - 100px);overflow:auto;touch-action:none;cursor:grab;overscroll-behavior:contain}
#zoomCanvas{display:flex;margin:auto;user-select:none}
#zoomCanvas img{height:100%;min-width:0;flex:1;object-fit:fill;pointer-events:none}
.zoom-hint{text-align:center;font-size:12px;height:36px;margin:0;padding:8px;color:#d8e5de}
</style>
</head>
<body>
<header>
<strong>Südafrika · Reisekatalog 01/2027</strong>
<small>Regenwaldreisen – Reisen. Erleben. Entdecken.</small>
</header>

<main class="viewer">
<div id="book"></div>
</main>

<nav class="controls">
<button id="prev">← Zurück</button>
<span id="count">Seite 1 / 169</span>
<button id="next">Weiter →</button>
<button id="zoomOpen" aria-label="Aktuelle Seiten vergrössern">🔍 Lupe</button>
</nav>

<dialog id="zoomDialog" aria-label="Vergrösserte Katalogseiten">
<div class="zoom-tools">
<button id="zoomOut" aria-label="Verkleinern">−</button>
<output id="zoomLevel" aria-live="polite">100%</output>
<button id="zoomIn" aria-label="Vergrössern">+</button>
<button id="zoomReset">Einpassen</button>
<button id="zoomClose" aria-label="Zoom schliessen">✕ Schliessen</button>
</div>
<div id="zoomViewport"><div id="zoomCanvas"></div></div>
<p class="zoom-hint">Ziehen zum Verschieben · Zwei Finger oder + / − zum Zoomen</p>
</dialog>
<script src="page-flip.browser.js"></script>
<script>
'use strict';

const total = 169;
const book = document.getElementById('book');
const counter = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');

for(let i=1;i<=total;i++){
  const page=document.createElement('div');
  page.className='page';

  const img=document.createElement('img');
  img.src='pages/seite-'+String(i).padStart(2,'0')+'.jpg';
  img.alt='Südafrika – Seite '+i;
  img.draggable=false;

  page.appendChild(img);
  book.appendChild(page);
}

const flip=new St.PageFlip(book,{
  width:480,
  height:679,
  size:'stretch',
  minWidth:180,
  maxWidth:480,
  minHeight:255,
  maxHeight:679,
  showCover:true,
  usePortrait:true,
  mobileScrollSupport:false,
  drawShadow:true,
  maxShadowOpacity:0.45,
  flippingTime:850,
  autoSize:true,
  clickEventForward:true,
  swipeDistance:25
});

flip.loadFromHTML(document.querySelectorAll('.page'));

function update(){
  const current=flip.getCurrentPageIndex();
  counter.textContent='Seite '+(current+1)+' / '+total;
  prev.disabled=current===0;
  next.disabled=current>=total-1;
}

prev.addEventListener('click',()=>flip.flipPrev());
next.addEventListener('click',()=>flip.flipNext());

flip.on('flip',update);
flip.on('init',update);

document.addEventListener('keydown',e=>{
  if(zoomDialog.open)return;
  if(e.key==='ArrowRight')flip.flipNext();
  if(e.key==='ArrowLeft')flip.flipPrev();
});

// A separate reading view keeps zoom gestures independent of page turning.
const zoomDialog=document.getElementById('zoomDialog');
const zoomViewport=document.getElementById('zoomViewport');
const zoomCanvas=document.getElementById('zoomCanvas');
const zoomLevel=document.getElementById('zoomLevel');
let zoomScale=1, baseWidth=0, baseHeight=0, pageCount=1;
const pointers=new Map();
function fitZoom(){
  const ratio=(595/842)*pageCount;
  baseHeight=Math.min(zoomViewport.clientHeight,zoomViewport.clientWidth/ratio);
  baseWidth=baseHeight*ratio;
  zoomScale=1;paintZoom();
  zoomViewport.scrollLeft=0;zoomViewport.scrollTop=0;
}
function paintZoom(){
  zoomCanvas.style.width=(baseWidth*zoomScale)+'px';
  zoomCanvas.style.height=(baseHeight*zoomScale)+'px';
  zoomLevel.textContent=Math.round(zoomScale*100)+'%';
  document.getElementById('zoomOut').disabled=zoomScale<=1;
  document.getElementById('zoomIn').disabled=zoomScale>=5;
}
function setZoom(value,x=zoomViewport.clientWidth/2,y=zoomViewport.clientHeight/2){
  const old=zoomScale, oldLeft=zoomCanvas.offsetLeft, oldTop=zoomCanvas.offsetTop;
  const cx=(zoomViewport.scrollLeft+x-oldLeft)/old;
  const cy=(zoomViewport.scrollTop+y-oldTop)/old;
  zoomScale=Math.max(1,Math.min(5,value));paintZoom();
  zoomViewport.scrollLeft=zoomCanvas.offsetLeft+cx*zoomScale-x;
  zoomViewport.scrollTop=zoomCanvas.offsetTop+cy*zoomScale-y;
}
function openZoom(){
  if(zoomDialog.open)return;
  const current=flip.getCurrentPageIndex();
  const indices=[current];
  if(flip.getOrientation()==='landscape' && current>0 && current+1<total)indices.push(current+1);
  pageCount=indices.length;zoomCanvas.replaceChildren();
  for(const i of indices){
    const img=document.createElement('img');
    img.src='pages/seite-'+String(i+1).padStart(2,'0')+'.jpg';
    img.alt='Südafrika – Seite '+(i+1);img.draggable=false;zoomCanvas.appendChild(img);
  }
  zoomDialog.showModal();document.body.style.overflow='hidden';fitZoom();
}
document.getElementById('zoomOpen').addEventListener('click',openZoom);
document.getElementById('zoomClose').addEventListener('click',()=>zoomDialog.close());
zoomDialog.addEventListener('close',()=>{document.body.style.overflow='';pointers.clear();});
document.getElementById('zoomIn').addEventListener('click',()=>setZoom(zoomScale*1.4));
document.getElementById('zoomOut').addEventListener('click',()=>setZoom(zoomScale/1.4));
document.getElementById('zoomReset').addEventListener('click',fitZoom);
zoomViewport.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});zoomViewport.setPointerCapture(e.pointerId);
});
zoomViewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const before=[...pointers.values()];const previous=pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const after=[...pointers.values()];
  if(after.length===2){
    const distance=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    const d=distance(before);if(d<1)return;
    const rect=zoomViewport.getBoundingClientRect();
    setZoom(zoomScale*distance(after)/d,(after[0].x+after[1].x)/2-rect.left,(after[0].y+after[1].y)/2-rect.top);
  }else if(after.length===1){
    zoomViewport.scrollLeft-=e.clientX-previous.x;zoomViewport.scrollTop-=e.clientY-previous.y;
  }
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])zoomViewport.addEventListener(event,e=>pointers.delete(e.pointerId));
zoomViewport.addEventListener('wheel',e=>{
  e.preventDefault();const rect=zoomViewport.getBoundingClientRect();
  setZoom(zoomScale*Math.exp(-e.deltaY*.002),e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
zoomViewport.addEventListener('dblclick',e=>{
  const rect=zoomViewport.getBoundingClientRect();setZoom(zoomScale>1?1:2,e.clientX-rect.left,e.clientY-rect.top);
});
window.addEventListener('resize',()=>{if(zoomDialog.open)fitZoom();});
update();
</script>
</body>
</html>
