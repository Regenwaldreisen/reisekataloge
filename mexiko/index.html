<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mexiko – Reisekatalog 2027 | Regenwaldreisen</title>
<style>html,body{margin:0;min-height:100%;background:#edf0ed;font-family:Arial,sans-serif;color:#16392c}header{text-align:center;padding:12px 8px}h1{font-size:clamp(19px,3vw,28px);margin:0 0 4px}#book{margin:auto}#book img{width:100%;height:100%;object-fit:contain;background:white}.controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px;flex-wrap:wrap}button{background:#164a37;color:white;border:0;border-radius:5px;padding:10px 18px;cursor:pointer}button:focus-visible{outline:3px solid orange}small{color:#53645b}footer{text-align:center;padding:6px 0 18px}a{color:#164a37}</style></head>
<body><header><h1>Mexiko – Reisekatalog 2027</h1><small>Regenwaldreisen · Reisen. Erleben. Entdecken.</small></header>
<div id="book"></div><nav class="controls"><button id="prev" aria-label="Vorherige Seite">◀ Zurück</button><span id="pageInfo">Seite 1 von 40</span><button id="next" aria-label="Nächste Seite">Weiter ▶</button></nav><footer><a href="https://www.regenwaldreisen.ch/" target="_blank" rel="noopener">www.regenwaldreisen.ch</a></footer>
<script src="page-flip.browser.js"></script><script>
const total=40;
const pages=Array.from({length:total},(_,i)=>`pages/seite-${String(i+1).padStart(2,'0')}.jpg`);
const book=document.getElementById('book');
if(typeof St==='undefined'||!St.PageFlip){book.innerHTML='<p style="text-align:center">Die Blätterfunktion benötigt die Datei <b>page-flip.browser.js</b> im selben Ordner wie index.html.</p>';}else{
 const flip=new St.PageFlip(book,{width:595,height:842,size:'stretch',minWidth:280,maxWidth:595,minHeight:396,maxHeight:842,showCover:true,mobileScrollSupport:false,usePortrait:true,autoSize:true,flippingTime:650,maxShadowOpacity:0.25});
 flip.loadFromImages(pages);
 const update=()=>document.getElementById('pageInfo').textContent=`Seite ${flip.getCurrentPageIndex()+1} von ${total}`;
 flip.on('flip',update);document.getElementById('prev').onclick=()=>flip.flipPrev();document.getElementById('next').onclick=()=>flip.flipNext();
 document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip.flipPrev();if(e.key==='ArrowRight')flip.flipNext()});update();
}
</script></body></html>
