<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argentinien 2027 | Regenwaldreisen</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#152b38;color:#fff;font-family:Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#0c202d}header strong{font-size:18px}header a{color:#d3e8f6;font-size:13px}main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - 112px);padding:14px 10px;overflow:hidden}.book-wrap{width:100%;display:flex;align-items:center;justify-content:center;min-height:200px}.page{background:white;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:fill}.controls{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px 10px 18px}button{background:#e8f3f9;border:0;border-radius:7px;color:#143145;font-size:16px;font-weight:bold;padding:9px 17px;cursor:pointer}button:hover{background:white}#counter{min-width:120px;text-align:center;font-size:14px}footer{text-align:center;font-size:12px;color:#b8cbd5;padding:0 10px 12px}@media(max-width:600px){header strong{font-size:15px}header a{font-size:11px}main{min-height:calc(100dvh - 120px)}}
</style>
</head>
<body>
<header><strong>Argentinien · Reisekatalog 01/2027</strong><a href="https://www.regenwaldreisen.ch/" target="_blank" rel="noopener">Regenwaldreisen.ch ↗</a></header>
<main><div class="book-wrap"><div id="book">
<div class="page" data-density="hard"><img src="pages/seite-01.jpg" alt="Titelseite Argentinien" /></div>
<div class="page"><img src="pages/seite-02.jpg" alt="Seite 2" /></div>
<div class="page"><img src="pages/seite-03.jpg" alt="Seite 3" /></div>
<div class="page"><img src="pages/seite-04.jpg" alt="Seite 4" /></div>
<div class="page"><img src="pages/seite-05.jpg" alt="Seite 5" /></div>
<div class="page"><img src="pages/seite-06.jpg" alt="Seite 6" /></div>
<div class="page"><img src="pages/seite-07.jpg" alt="Seite 7" /></div>
<div class="page"><img src="pages/seite-08.jpg" alt="Seite 8" /></div>
<div class="page"><img src="pages/seite-09.jpg" alt="Seite 9" /></div>
<div class="page" data-density="hard"><img src="pages/seite-10.jpg" alt="Seite 10" /></div>
</div></div></main>
<div class="controls"><button id="prev" aria-label="Vorherige Seite">❮ Zurück</button><span id="counter">Seite 1 von 10</span><button id="next" aria-label="Nächste Seite">Weiter ❯</button></div>
<footer>Mit der Maus über die Seitenecke ziehen oder die Pfeiltasten verwenden.</footer>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function(){
const book=document.getElementById('book');const counter=document.getElementById('counter');
if(!window.St || !St.PageFlip){counter.textContent='Blättereffekt konnte nicht geladen werden.';return;}
const flip=new St.PageFlip(book,{width:540,height:720,size:'stretch',minWidth:240,maxWidth:540,minHeight:320,maxHeight:720,maxShadowOpacity:.35,showCover:true,mobileScrollSupport:false,flippingTime:850,usePortrait:true,startPage:0,drawShadow:true,autoSize:true});
flip.loadFromHTML(document.querySelectorAll('.page'));
function update(){const p=flip.getCurrentPageIndex();counter.textContent='Seite '+(p+1)+' von 10'}
flip.on('flip',update);flip.on('init',update);
document.getElementById('prev').addEventListener('click',()=>flip.flipPrev());document.getElementById('next').addEventListener('click',()=>flip.flipNext());
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip.flipNext();if(e.key==='ArrowLeft')flip.flipPrev()});
update();
})();
</script>
</body></html>
